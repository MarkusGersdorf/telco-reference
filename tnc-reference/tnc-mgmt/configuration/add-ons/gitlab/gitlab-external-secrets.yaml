---
# Example values -- rendered from vars.yaml by stage_config and by the
# gitlab role, which bootstraps from the same file. Edit the .j2 template.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-object-storage
  namespace: gitlab-system
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-object-storage
    creationPolicy: Owner
  data:
    - secretKey: connection
      remoteRef:
        key: gitlab/object-storage
        property: connection
