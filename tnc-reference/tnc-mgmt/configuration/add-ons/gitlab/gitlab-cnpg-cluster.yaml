---
# Example values -- rendered from vars.yaml by stage_config and by the
# gitlab role, which bootstraps from the same file. Edit the .j2 template.
apiVersion: postgresql.k8s.enterprisedb.io/v1
kind: Cluster
metadata:
  name: gitlab-postgres
  namespace: gitlab-system
spec:
  affinity:
    podAntiAffinityType: preferred
  backup:
    barmanObjectStore:
      data:
        compression: gzip
        encryption: AES256
        immediateCheckpoint: false
        jobs: 2
      destinationPath: s3://gitlab-edb-backup/
      # Derived rather than looked up live, so stage_config can render this
      # before NooBaa exists on a first run. Override odf.s3_endpoint if that
      # route carries a custom host.
      endpointURL: https://s3-openshift-storage.apps.mgmt1.example.com
      s3Credentials:
        accessKeyId:
          key: ACCESS_KEY_ID
          name: cnpg-s3-backup-creds
        secretAccessKey:
          key: SECRET_ACCESS_KEY
          name: cnpg-s3-backup-creds
      wal:
        compression: gzip
        encryption: AES256
    retentionPolicy: "30d"
    target: prefer-standby
    volumeSnapshot:
      online: true
      onlineConfiguration:
        immediateCheckpoint: false
        waitForArchive: true
      snapshotOwnerReference: none
  bootstrap:
    initdb:
      database: gitlabhq_production
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: gitlab
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
        - CREATE EXTENSION IF NOT EXISTS btree_gist;
        - CREATE EXTENSION IF NOT EXISTS plpgsql;
      secret:
        name: gitlab-postgres-creds
  enablePDB: true
  enableSuperuserAccess: false
  failoverDelay: 0
  imageName: docker.enterprisedb.com/k8s/postgresql:18-standard-ubi9
  instances: 3
  logLevel: info
  maxSyncReplicas: 0
  minSyncReplicas: 0
  monitoring:
    customQueriesConfigMap:
      - key: queries
        name: postgresql-operator-default-monitoring
    disableDefaultQueries: false
    enablePodMonitor: true
  postgresGID: 26
  postgresql:
    parameters:
      archive_mode: "on"
      archive_timeout: 5min
      dynamic_shared_memory_type: posix
      full_page_writes: "on"
      log_destination: csvlog
      log_directory: /controller/log
      log_filename: postgres
      log_rotation_age: "0"
      log_rotation_size: "0"
      log_truncate_on_rotation: "false"
      logging_collector: "on"
      max_connections: "400"
      max_locks_per_transaction: "256"
      max_parallel_workers: "8"
      max_replication_slots: "32"
      max_slot_wal_keep_size: 5GB
      max_worker_processes: "8"
      shared_buffers: 2GB
      shared_memory_type: mmap
      ssl_max_protocol_version: TLSv1.3
      ssl_min_protocol_version: TLSv1.3
      wal_keep_size: 512MB
      wal_level: logical
      wal_log_hints: "on"
      wal_receiver_timeout: 5s
      wal_sender_timeout: 60s
    syncReplicaElectionConstraint:
      enabled: false
  postgresUID: 26
  primaryUpdateMethod: restart
  primaryUpdateStrategy: unsupervised
  probes:
    liveness:
      isolationCheck:
        connectionTimeout: 1000
        enabled: true
        requestTimeout: 1000
  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: _cnp_
    synchronizeReplicas:
      enabled: true
    updateInterval: 30
  resources:
    limits:
      cpu: 750m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 2Gi
  smartShutdownTimeout: 180
  startDelay: 3600
  stopDelay: 1800
  storage:
    resizeInUseVolumes: true
    size: 100Gi
    storageClass: ocs-storagecluster-ceph-rbd
  switchoverDelay: 3600
  walStorage:
    resizeInUseVolumes: true
    size: 15Gi
    storageClass: ocs-storagecluster-ceph-rbd
---
apiVersion: postgresql.k8s.enterprisedb.io/v1
kind: ScheduledBackup
metadata:
  name: gitlab-daily-backup
  namespace: gitlab-system
spec:
  backupOwnerReference: self
  cluster:
    name: gitlab-postgres
  immediate: true
  schedule: "0 0 3 * * *"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-s3-backup-access
  namespace: gitlab-system
rules:
  - apiGroups: [""]
    resourceNames: [cnpg-s3-backup-creds]
    resources: [secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-s3-backup-access
  namespace: gitlab-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-s3-backup-access
subjects:
  - kind: ServiceAccount
    name: gitlab-postgres
    namespace: gitlab-system
