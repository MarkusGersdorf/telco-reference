---
# Synced by the hub-add-ons Application. values/ is deliberately not listed --
# kustomize ignores those files, and ArgoCD reads them through $values on the
# Applications instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # gitlab/ is deliberately not listed: the gitlab Application syncs that
  # directory itself, so listing it here would have hub-config manage the
  # same objects -- with pruning on, which is exactly what that Application
  # exists to avoid.
  - gitlab-app.yaml
  - netbox-ns.yaml
  - netbox-keycloak-externalsecret.yaml
  - vault-app.yaml
  - netbox-app.yaml
