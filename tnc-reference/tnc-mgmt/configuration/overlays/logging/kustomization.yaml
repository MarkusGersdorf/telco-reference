---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../reference-crs/optional/logging/
  - ../../other-crs/optional/logging/

patches:
  # Customize ClusterLogForwarder for hub-specific configuration.
  # Swap the path back to cluster-log-forwarder-patch.yaml to restore
  # collection -- the patch is kept alongside, not deleted.
  - target:
      group: observability.openshift.io
      version: v1
      kind: ClusterLogForwarder
      name: instance
    #path: cluster-log-forwarder-patch.yaml
    path: delete-cluster-log-forwarder.yaml
