---
# patching ClusterLogForwarder for mgmt1-specific configuration
- op: replace
  path: /metadata/annotations
  value:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous

# Logs go to the in-cluster LokiStack. The upstream CR forwards to Kafka,
# which this deployment does not run -- see overlays/loki.
- op: replace
  path: /spec
  value:
    managementState: Managed
    filters:
     - name: telco-hub-labels
       type: openshiftLabels
       openshiftLabels:
         cluster-role: hub
         environment: production
         telco-component: management
    outputs:
     - name: default-lokistack
       type: lokiStack
       lokiStack:
         target:
           name: logging-loki
           namespace: openshift-logging
         authentication:
           token:
             from: serviceAccount
       tls:
         ca:
           key: service-ca.crt
           configMapName: openshift-service-ca.crt
    pipelines:
     - name: infra-pipe
       filterRefs:
       - telco-hub-labels
       inputRefs:
       - infrastructure
       outputRefs:
       - default-lokistack
     - name: audit-pipe
       filterRefs:
       - telco-hub-labels
       inputRefs:
       - audit
       outputRefs:
       - default-lokistack
     - name: app-pipe
       filterRefs:
       - telco-hub-labels
       inputRefs:
       - application
       outputRefs:
       - default-lokistack
    serviceAccount:
      name: collector
