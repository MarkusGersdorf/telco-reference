---
# The hub only. Same selector the ztp-argocd-plugins placement uses, so the
# policy lands on local-cluster and nowhere else -- which is the point of
# routing these through ACM rather than applying them directly.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: hub-operators-pl
  namespace: hub-policies
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: In
              values:
                - local-cluster
