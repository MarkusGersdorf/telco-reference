---
# The collector writes through the LokiStack gateway using its own
# ServiceAccount token, which needs the writer role the Loki operator
# creates. Binding ahead of the role existing is harmless -- it simply
# grants nothing until the operator reconciles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logging-collector-logs-writer
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logging-collector-logs-writer
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: openshift-logging
