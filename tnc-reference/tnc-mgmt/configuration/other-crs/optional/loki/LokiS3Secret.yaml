---
# LokiStack wants its S3 credentials under key names no ObjectBucketClaim
# produces, so reshape the OBC's Secret into the expected form. The endpoint
# is the internal service rather than the NooBaa route: LokiStack has no
# insecure-skip option, and the service certificate is signed by the service
# CA that openshift-service-ca.crt carries into every namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: SecretStore
    name: loki-obc-store
  target:
    name: loki-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        access_key_id: "{{ .access_key_id }}"
        access_key_secret: "{{ .access_key_secret }}"
        bucketnames: "loki-logs"
        endpoint: "https://s3.openshift-storage.svc:443"
        region: "us-east-1"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: loki-bucket
        property: AWS_ACCESS_KEY_ID
    - secretKey: access_key_secret
      remoteRef:
        key: loki-bucket
        property: AWS_SECRET_ACCESS_KEY
