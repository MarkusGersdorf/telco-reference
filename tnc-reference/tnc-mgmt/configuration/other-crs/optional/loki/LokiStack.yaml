---
# Log store for the hub. Object storage is a NooBaa bucket claimed by
# LokiBucket.yaml, reached over the internal s3.openshift-storage service so
# the service CA validates it -- hence the tls block, which instances using
# the NooBaa route do not need. Sizing is patched in overlays/loki.
apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: logging-loki
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  managementState: Managed
  size: 1x.small
  storageClassName: ocs-storagecluster-ceph-rbd
  # Loki is only tested and supported for short-term storage, 30 days at
  # most. Without these the bucket and index grow unbounded and a single
  # noisy namespace can starve the others.
  limits:
    global:
      retention:
        days: 30
      ingestion:
        ingestionRate: 50
        ingestionBurstSize: 100
        maxGlobalStreamsPerTenant: 50000
  storage:
    schemas:
      - version: v13
        effectiveDate: "2024-01-01"
    secret:
      name: loki-s3
      type: s3
    tls:
      caName: openshift-service-ca.crt
      caKey: service-ca.crt
  tenants:
    mode: openshift-logging
