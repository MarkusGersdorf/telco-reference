---
# NooBaa provisions the bucket and drops a Secret and ConfigMap of the same
# name alongside it. bucketName is set explicitly rather than generated so
# the name stays predictable for the ExternalSecret below.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: loki-bucket
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  bucketName: loki-logs
  storageClassName: openshift-storage.noobaa.io
