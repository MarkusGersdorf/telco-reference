---
# Reads the ObjectBucketClaim's generated credentials so the ExternalSecret
# can reshape them. Source and target are both in openshift-logging, so this
# is a namespaced SecretStore with its own ServiceAccount rather than a
# ClusterSecretStore -- nothing outside this namespace needs to be readable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-secret-reader
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loki-secret-reader
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-secret-reader
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loki-secret-reader
subjects:
  - kind: ServiceAccount
    name: loki-secret-reader
    namespace: openshift-logging
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: loki-obc-store
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    kubernetes:
      remoteNamespace: openshift-logging
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: openshift-logging
      auth:
        serviceAccount:
          name: loki-secret-reader
