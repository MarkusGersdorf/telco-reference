---
# Database access on 5432.
#
# Selected by postgresql: <cluster>, the label EDB Postgres for Kubernetes
# puts on its instance pods. The previous version used cnpg.io/cluster,
# which is community CloudNativePG's label -- it matched nothing here, and
# a podSelector matching nothing does not fail, it just covers no pods. All
# the database rules applied to nothing, default-deny-ingress was the only
# policy left touching those pods, and Keycloak could not reach 5432.
#
# The source stays the whole namespace rather than app: keycloak. Keycloak
# reaches this database from more than its server pods -- the operator's
# realm import runs as a Job, and backup and restore run in pods the
# database operator creates, all carrying labels this repo does not
# control. Nothing outside Keycloak reaches it either way, because nothing
# else runs in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  podSelector:
    matchLabels:
      postgresql: keycloak-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
---
# Replication between the instances. Covered by the rule above today, since
# they are pods in this namespace, but kept separate so that narrowing the
# source there later cannot silently break replication.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-replication
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  podSelector:
    matchLabels:
      postgresql: keycloak-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              postgresql: keycloak-postgres
      ports:
        - protocol: TCP
          port: 5432
