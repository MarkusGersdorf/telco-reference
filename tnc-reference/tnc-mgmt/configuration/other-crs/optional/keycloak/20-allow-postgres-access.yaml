---
# Database access on 5432.
#
# Selected by postgresql: <cluster>, the label EDB Postgres for Kubernetes
# puts on its instance pods. The previous version used cnpg.io/cluster,
# which is community CloudNativePG's label -- it matched nothing here, and
# a podSelector matching nothing does not fail, it just covers no pods. All
# the database rules applied to nothing, default-deny-ingress was the only
# policy left touching those pods, and Keycloak could not reach 5432.
#
# Only Keycloak's own pods, not the whole namespace.
#
# The one thing this can break is the realm import. The operator runs it as
# a Job rather than in the server pods, and it writes to this database
# directly, so it needs 5432 like everything else. If that Job's pods do
# not carry app: keycloak, imports will fail to connect and realm changes
# will stop applying -- the server itself keeps working, which is what
# makes it easy to miss. Check during an import with:
#
#   oc -n keycloak get pods -l app=keycloak --show-labels
#
# and if the Job is labelled differently, widen this to the label both
# share, app.kubernetes.io/managed-by: keycloak-operator, rather than going
# back to the whole namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  podSelector:
    matchLabels:
      postgresql: keycloak-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 5432
---
# Replication between the instances. Covered by the rule above today, since
# they are pods in this namespace, but kept separate so that narrowing the
# source there later cannot silently break replication.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-replication
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  podSelector:
    matchLabels:
      postgresql: keycloak-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              postgresql: keycloak-postgres
      ports:
        - protocol: TCP
          port: 5432
