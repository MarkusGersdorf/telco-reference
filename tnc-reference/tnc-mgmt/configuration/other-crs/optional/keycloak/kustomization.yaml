---
# Keycloak's declarative surface. The realm import is deliberately absent:
# it embeds six OIDC client secrets read from Vault at run time, so it stays
# with the keycloak role, which seeds the realm as part of bootstrap.
#
# The CNPG database is also still ansible-owned -- its backup configuration
# needs the NooBaa S3 route and a credentials secret the role creates first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - keycloak-namespace.yaml
  - keycloak-external-secrets.yaml
  - keycloak-cr.yaml
  - keycloak-certificate.yaml
  - keycloak-route.yaml
  - 00-default-deny-ingress.yaml
  - 10-allow-ingress-to-keycloak.yaml
  - 20-allow-postgres-access.yaml
  - 30-allow-postgres-operator-and-metrics.yaml
