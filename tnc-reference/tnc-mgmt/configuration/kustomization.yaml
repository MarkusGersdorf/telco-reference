# kustomization file including different overays over the
# reference crs
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:

  # resources not managed by any overlay
  - reference-crs/required/talm/

   ####################
   # MGMT1 cluster overlay - #-node or multi-node MGMT
   ####################

  # if you use LocalStorage operator, edit and configure the patch
  - overlays/lso/

  # if you use ODF, edit and configure storage settings
  - overlays/odf/

  # if using LVMS (SNO) instead of ODF/LSO:
  #- overlays/lvms/

  # other not optional overlays
  - overlays/gitops/
  - overlays/acm/
  - overlays/registry/
  - overlays/vault/
  - overlays/quay/

  # logging: collector + ClusterLogForwarder, with LokiStack as the log store.
  # Enable both or neither -- the forwarder has no other destination.
  - overlays/logging
  - overlays/loki/

  # optional resources if deploying AMQ kafka. The logging overlay forwards to
  # LokiStack, not Kafka, so these are off by default.
  #- overlays/kafka/
  #- overlays/monitoring-kafka

  # include this content if you want to include the argocd
  # configuration and apps for gitops ztp management of workload cluster
  # installation and configuration
  # - overlays/gitops-ztp/

  # resources not managed by any overlay
  - other-crs/optional/ansible/
  - other-crs/optional/cnv/       # Enable OpenShift virtualization to create VMs for IDM and/or satellite
