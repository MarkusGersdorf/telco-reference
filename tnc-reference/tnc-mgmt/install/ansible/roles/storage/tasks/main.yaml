---
- name: Install LSO operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }} apply
    -f {{ config_stage_dir }}/reference-crs/optional/lso/lsoNS.yaml
    -f {{ config_stage_dir }}/reference-crs/optional/lso/lsoOperatorGroup.yaml
    -f {{ config_stage_dir }}/reference-crs/optional/lso/lsoSubscription.yaml
  when: "'lso' in configuration.components"

- name: Wait for LSO operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n openshift-local-storage get subscriptions.operators.coreos.com
    local-storage-operator -o jsonpath='{.status.state}'
  register: lso_state
  until: lso_state.stdout == "AtLatestKnown"
  retries: 30
  delay: 20
  changed_when: false
  when: "'lso' in configuration.components"

- name: Wait for LocalVolume CRD
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get crd localvolumes.local.storage.openshift.io
  register: lso_crd
  until: lso_crd.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: "'lso' in configuration.components"

- name: Apply LSO overlay (LocalVolume with disk paths)
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -k {{ config_stage_dir }}/overlays/lso/
  when: "'lso' in configuration.components"

- name: Install ODF operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }} apply
    -f {{ config_stage_dir }}/reference-crs/optional/odf-internal/odfNS.yaml
    -f {{ config_stage_dir }}/reference-crs/optional/odf-internal/odfOperatorGroup.yaml
    -f {{ config_stage_dir }}/reference-crs/optional/odf-internal/odfSubscription.yaml
  when: "'odf' in configuration.components"

- name: Wait for ODF operator
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n openshift-storage get subscriptions.operators.coreos.com
    odf-operator -o jsonpath='{.status.state}'
  register: odf_state
  until: odf_state.stdout == "AtLatestKnown"
  retries: 30
  delay: 20
  changed_when: false
  when: "'odf' in configuration.components"

- name: Wait for StorageCluster CRD
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    get crd storageclusters.ocs.openshift.io
  register: odf_crd
  until: odf_crd.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: "'odf' in configuration.components"

- name: Label worker nodes for ODF
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    label node {{ item.hostname }} cluster.ocs.openshift.io/openshift-storage="" --overwrite
  loop: "{{ hosts | selectattr('role', 'equalto', 'worker') | list }}"
  loop_control:
    label: "{{ item.hostname }}"
  when: "'odf' in configuration.components"

- name: Apply ODF overlay (StorageCluster with patched values)
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    apply -k {{ config_stage_dir }}/overlays/odf/
  when: "'odf' in configuration.components"

- name: Wait for StorageCluster to be ready
  ansible.builtin.command: >
    oc --kubeconfig {{ kubeconfig_path }}
    -n openshift-storage get storagecluster ocs-storagecluster
    -o jsonpath='{.status.phase}'
  register: sc_phase
  until: sc_phase.stdout == "Ready"
  retries: 60
  delay: 30
  changed_when: false
  when: "'odf' in configuration.components"
